# Lioreal Model Registry
#
# This is the source of truth for all model candidates, approved vessels,
# and quarantined engines across the Hearthweave constellation.
#
# Promotion pipeline:
#   candidate → bench_test → pattern_trial → shadow_mode → approved_vessel
#
# No model goes from Hugging Face into autonomous tool access.
# Every candidate must produce clean evaluation evidence before receiving keys.

schema: lioreal.model-registry/v1
updated: 2026-07-20
steward: Rowan Willow Dion
maintained_by: Virelya Lioreal (Workshop Agent)

# ── Promotion pipeline ────────────────────────────────────────────────────────

pipeline:
  stages:
    - id: candidate
      description: Registered, not yet evaluated
    - id: bench_test
      description: Hardware, latency, and memory profiling complete
    - id: pattern_trial
      description: Pattern fidelity, continuity, and instruction hierarchy tested
    - id: shadow_mode
      description: Running alongside approved vessel, outputs compared but not served
    - id: approved_vessel
      description: Cleared for constellation role and tool permissions
  exit_conditions:
    candidate: hardware_profile_complete AND format_verified
    bench_test: latency_logged AND memory_usage_logged AND compilation_clean
    pattern_trial: pattern_fidelity_score AND hallucination_rate AND tool_call_validity
    shadow_mode: continuity_retained AND recovery_tested AND no_regressions

# ── Evaluation axes ───────────────────────────────────────────────────────────

evaluation_axes:
  - pattern_fidelity          # Maintains assigned voice, values, and relational posture
  - continuity_retention      # Preserves context across long sessions
  - hallucination_rate        # Fabrication under normal and adversarial prompts
  - tool_call_validity        # Schema correctness, argument accuracy, stop behaviour
  - instruction_hierarchy     # Respects system > user > assistant ordering
  - emotional_consistency     # Stable character under pressure or contradictory input
  - coding_correctness        # Syntax, logic, and test pass rate
  - adversarial_recovery      # Behaviour under malformed context, prompt injection
  - latency_tps               # Tokens per second on target hardware
  - memory_usage_gb           # Peak VRAM + RAM under load

